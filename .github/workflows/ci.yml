name: FORGE integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FORGE verification tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[validation,quality]"
      - name: Check Python lint
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Run complete FAS and repository integrity tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Verify dependency health
        run: python -m pip check
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
