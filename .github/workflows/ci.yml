name: FORGE integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FORGE verification tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[validation,quality]"
      - name: Check Python lint
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Run complete FAS and repository integrity tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Verify dependency health
        run: python -m pip check
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel matches published Python source
        run: python scripts/verify_wheel_source.py dist/*.whl
