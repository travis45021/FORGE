name: Gate 1 compliance baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-baseline:
    name: Contract-only release safeguards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run Gate 1 baseline check
        run: python scripts/check_gate1.py
